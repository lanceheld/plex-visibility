services:
  plex-visibility:
    build: .
    container_name: plex-visibility
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Settings, history, and apprise-api's own data.
      - ./config:/config
    environment:
      TZ: Etc/UTC
      # Run as your user so ./config is owned by you (find yours with `id`).
      PUID: 1000
      PGID: 1000
      # Strongly recommended if anyone else can reach port 8080.
      UI_PASSWORD: ${UI_PASSWORD:-}
