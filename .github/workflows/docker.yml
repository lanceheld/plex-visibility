name: Docker image

# Snapshot builds: every push to main, tagged with `git describe` and `latest`.
# Release builds: publishing a GitHub release, tagged with the release version and `stable`.
# Snapshots go to GHCR only; releases go to GHCR and Docker Hub.
#
# Docker Hub needs a repository variable DOCKERHUB_USERNAME and a secret DOCKERHUB_TOKEN:
# a Docker Hub personal access token with read/write/delete scope (delete is needed to
# update the repository description from README.md).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history and tags, for git describe.
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
            # A pre-release gets its version tag but doesn't move `stable`.
            if [ "$PRERELEASE" = "true" ]; then channel=""; else channel="stable"; fi
          else
            # Always <tag>-<commits since tag>-g<hash>, so snapshot tags have two dashes
            # (the purge workflow relies on this). --long keeps a snapshot of a tagged
            # commit from reusing the release's tag. Before the first tag, fall back to a
            # 0.0.0 pseudo version in the same shape.
            if ! version="$(git describe --tags --long --dirty 2>/dev/null)"; then
              version="0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short HEAD)"
            fi
            version="${version#v}"
            channel="latest"
          fi
          # Docker tags allow [A-Za-z0-9_.-] only.
          version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9_.-' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version: $version, channel: ${channel:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Docker Hub credentials
        if: github.event_name == 'release'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable and DOCKERHUB_TOKEN secret to publish releases to Docker Hub."
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/plex-visibility,enable=${{ github.event_name == 'release' }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.channel }},enable=${{ steps.version.outputs.channel != '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub page in step with the README of the release.
      - name: Update Docker Hub description
        if: github.event_name == 'release'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/plex-visibility
          short-description: Monitors Plex remote access and alerts you when your server can't be reached from outside
          readme-filepath: ./README.md
          # Turn relative links (like #the-blind-spot-and-the-heartbeat) into absolute GitHub links.
          enable-url-completion: true
