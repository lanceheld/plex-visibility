name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the Sonar auth step exchange the job's OIDC token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run npm audit
        run: npm run audit

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:coverage

      # Exchanges the job's GitHub OIDC token for a short-lived SonarQube Cloud
      # token and exports it as SONAR_TOKEN for the steps below. No stored secret.
      - name: SonarQube Cloud authentication
        uses: SonarSource/sonarqube-auth-action@v1

      # qualitygate.wait makes the scan wait for the quality gate and fail the
      # step when it fails, so no separate quality gate action is needed.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
